name: shellcheck

on:
  push:
    paths: ['**.sh']
  pull_request:
    paths: ['**.sh']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -s bash hosting-dns.sh
